AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MediSlot authentication Lambda functions exposed through the shared application
  API Gateway
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - test
    - prod
  DBUsername:
    Type: String
    Default: medislot_app
    Description: MySQL application user the Lambda functions connect as
  DBPasswordParameterVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Version of the application database password in SSM SecureString
  JWTSecretParameterVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Version of the JWT signing secret in SSM SecureString
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        DB_NAME: medislot
        DB_USER:
          Ref: DBUsername
        DB_HOST_PARAMETER:
          Fn::Sub: /medislot/${Environment}/db/host
        DB_PORT_PARAMETER:
          Fn::Sub: /medislot/${Environment}/db/port
        DB_PASSWORD_PARAMETER:
          Fn::Sub: /medislot/${Environment}/db/app-password
        DB_MASTER_PASSWORD_PARAMETER:
          Fn::Sub: /medislot/${Environment}/db/password
        DB_MASTER_USERNAME: medislotadmin
        DB_PASSWORD_PARAMETER_VERSION:
          Ref: DBPasswordParameterVersion
        JWT_SECRET_PARAMETER:
          Fn::Sub: /medislot/${Environment}/auth/jwt-secret
        JWT_SECRET_PARAMETER_VERSION:
          Ref: JWTSecretParameterVersion
        AUTH_TOKENS_TABLE:
          Fn::Sub: medislot-${Environment}-auth-tokens
        ACCESS_TOKEN_MINUTES: '15'
        REFRESH_TOKEN_DAYS: '7'
        PASSWORD_MIN_LENGTH: '10'
        BCRYPT_ROUNDS: '12'
Resources:
  AuthDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: medislot-${Environment}-auth-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
      - Key: Project
        Value: MediSlot
      - Key: Environment
        Value:
          Ref: Environment
    Metadata:
      SamResourceId: AuthDeadLetterQueue
  SchemaInitializerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: medislot-${Environment}-schema-init-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
      - Key: Project
        Value: MediSlot
      - Key: Environment
        Value:
          Ref: Environment
    Metadata:
      SamResourceId: SchemaInitializerDeadLetterQueue
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-register
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: register/register.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-RegisterLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: RegisterFunction
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-login
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: login/login.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-LoginLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: LoginFunction
  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-refresh
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: refresh/refresh.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-RefreshLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: RefreshFunction
  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-logout
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: logout/logout.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-LogoutLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: LogoutFunction
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-authorizer
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: authorizer/authorizer.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-AuthorizerLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: AuthorizerFunction
  SchemaInitializerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-schema-init
      Description: Initializes the MySQL schema from the repository schema.sql file
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: schema_init/schema_init.lambda_handler
      Environment:
        Variables:
          DB_APP_USERNAME:
            Ref: DBUsername
          DB_APP_PASSWORD_PARAMETER:
            Fn::Sub: /medislot/${Environment}/db/app-password
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-RegisterLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      Timeout: 60
      MemorySize: 256
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - SchemaInitializerDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: SchemaInitializerFunction
  ReferenceDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-reference-data
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/21ac51f2db4f1aef402c308fb310657d
      Handler: reference/reference.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-RegisterLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - AuthDeadLetterQueue
          - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: ReferenceDataFunction
  SlotMaterializerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: medislot-${Environment}-slot-materializer-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
    Metadata:
      SamResourceId: SlotMaterializerDeadLetterQueue
  SlotMaterializerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: medislot-${Environment}-slot-materializer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
      - PolicyName: ReadScheduleAndWriteSlots
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/host
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/port
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/app-password
          - Effect: Allow
            Action:
            - dynamodb:Query
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
            - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*
          - Effect: Allow
            Action:
            - kms:Decrypt
            - kms:Encrypt
            - kms:GenerateDataKey
            - kms:DescribeKey
            Resource:
              Fn::ImportValue:
                Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - SlotMaterializerDeadLetterQueue
              - Arn
    Metadata:
      SamResourceId: SlotMaterializerRole
  SlotMaterializerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: medislot-${Environment}-slot-materializer
      Description: Builds and reconciles the next 30 days of doctor appointment slots
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/authentication/d3f3e7429e7dfcb4f93dc4a64f31536ed748c688/41618042003/24f95a8f928ad8bda1a13a106ee6b434
      Handler: materializer.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 120
      Role:
        Fn::GetAtt:
        - SlotMaterializerRole
        - Arn
      KmsKeyArn:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - SlotMaterializerDeadLetterQueue
          - Arn
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          DB_NAME: medislot
          DB_USER:
            Ref: DBUsername
          DB_HOST_PARAMETER:
            Fn::Sub: /medislot/${Environment}/db/host
          DB_PORT_PARAMETER:
            Fn::Sub: /medislot/${Environment}/db/port
          DB_PASSWORD_PARAMETER:
            Fn::Sub: /medislot/${Environment}/db/app-password
          SLOTS_TABLE:
            Fn::Sub: medislot-${Environment}-slots
          SLOT_WINDOW_DAYS: '30'
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
    Metadata:
      SamResourceId: SlotMaterializerFunction
  SlotMaterializerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: medislot-${Environment}-slot-materializer-daily
      Description: Rebuilds the rolling 30-day slot window daily
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
      - Id: SlotMaterializerTarget
        Arn:
          Fn::GetAtt:
          - SlotMaterializerFunction
          - Arn
    Metadata:
      SamResourceId: SlotMaterializerSchedule
  AllowEventBridgeToInvokeSlotMaterializer:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SlotMaterializerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - SlotMaterializerSchedule
        - Arn
    Metadata:
      SamResourceId: AllowEventBridgeToInvokeSlotMaterializer
  SlotMaterializerAsyncFailureConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName:
        Ref: SlotMaterializerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
    Metadata:
      SamResourceId: SlotMaterializerAsyncFailureConfig
Outputs:
  ReferenceDataFunctionArn:
    Description: Public registration reference-data Lambda ARN
    Value:
      Fn::GetAtt:
      - ReferenceDataFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-ReferenceDataFunctionArn
  SlotMaterializerFunctionName:
    Description: Slot materialiser Lambda function name
    Value:
      Ref: SlotMaterializerFunction
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-SlotMaterializerFunctionName
  RegisterFunctionName:
    Description: Registration Lambda function name
    Value:
      Ref: RegisterFunction
  LoginFunctionName:
    Description: Login Lambda function name
    Value:
      Ref: LoginFunction
  RefreshFunctionName:
    Description: Refresh-token Lambda function name
    Value:
      Ref: RefreshFunction
  LogoutFunctionName:
    Description: Logout Lambda function name
    Value:
      Ref: LogoutFunction
  RegisterFunctionArn:
    Description: Registration Lambda function ARN for the shared API Gateway
    Value:
      Fn::GetAtt:
      - RegisterFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-RegisterFunctionArn
  LoginFunctionArn:
    Description: Login Lambda function ARN for the shared API Gateway
    Value:
      Fn::GetAtt:
      - LoginFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-LoginFunctionArn
  RefreshFunctionArn:
    Description: Refresh-token Lambda function ARN
    Value:
      Fn::GetAtt:
      - RefreshFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-RefreshFunctionArn
  LogoutFunctionArn:
    Description: Logout Lambda function ARN
    Value:
      Fn::GetAtt:
      - LogoutFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-LogoutFunctionArn
  AuthorizerFunctionArn:
    Description: Lambda authorizer function ARN for protected APIs
    Value:
      Fn::GetAtt:
      - AuthorizerFunction
      - Arn
    Export:
      Name:
        Fn::Sub: medislot-${Environment}-AuthorizerFunctionArn

