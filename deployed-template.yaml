
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MediSlot single API Gateway for authentication and application operations

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  AppRouterHandler:
    Type: String
    Default: app.lambda_handler
    Description: Python module and handler for the application API router

  EnableReservedConcurrency:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable one reserved concurrent execution for the router only when account quota allows it.

Conditions:
  UseReservedConcurrency: !Equals [!Ref EnableReservedConcurrency, "true"]

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 20
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_NAME: medislot
        DB_USER: medislot_app
        DB_HOST_PARAMETER: !Sub /medislot/${Environment}/db/host
        DB_PORT_PARAMETER: !Sub /medislot/${Environment}/db/port
        DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/app-password
        JWT_SECRET_PARAMETER: !Sub /medislot/${Environment}/auth/jwt-secret
        SLOTS_TABLE: !Sub medislot-${Environment}-slots
        IDEMPOTENCY_TABLE: !Sub medislot-${Environment}-idempotency
        WAITLIST_TABLE: !Sub medislot-${Environment}-waitlist
        HOLD_OFFERS_TABLE: !Sub medislot-${Environment}-hold-offers
        AUTH_TOKENS_TABLE: !Sub medislot-${Environment}-auth-tokens
        DOCTOR_PHOTOS_BUCKET:
          Fn::ImportValue: !Sub medislot-${Environment}-DoctorPhotosBucketName
        SLOT_MATERIALIZER_FUNCTION: !Sub medislot-${Environment}-slot-materializer
        DISPATCH_LOG_TABLE: !Sub medislot-${Environment}-dispatch-log

Resources:

  ApplicationApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/medislot-${Environment}-application-api
      RetentionInDays: 365
      KmsKeyId:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn

  ApplicationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub medislot-${Environment}-application-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotApplicationApi:
    Type: AWS::Serverless::Api #checkov:skip=CKV_AWS_120:Patient-specific dynamic responses must not be shared or cached.
    Properties:
      Name: !Sub medislot-${Environment}-application-api
      StageName: !Ref Environment
      MergeDefinitions: true
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApplicationApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength"}'
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,Idempotency-Key,X-Correlation-Id'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          MediSlotAuthorizer:
            FunctionArn:
              Fn::ImportValue: !Sub medislot-${Environment}-AuthorizerFunctionArn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 0

      DefinitionBody:
        swagger: "2.0"
        info:
          title: MediSlot API
          version: "1.0"
        schemes:
          - https

        paths:

          # Shared registration endpoint for doctors and patients
          /auth/register:
            post:
              security: []
              responses:
                "201":
                  description: Registration successful
                "400":
                  description: Invalid registration details
                "409":
                  description: Account already exists
                "500":
                  description: Registration failed
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-RegisterFunctionArn

          # Reference data
          /reference/specialisations:
            get:
              security: []
              responses:
                "200":
                  description: Reference data
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-ReferenceDataFunctionArn

          /reference/hospitals:
            get:
              security: []
              responses:
                "200":
                  description: Reference data
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-ReferenceDataFunctionArn

          # Shared login endpoint
          /auth/login:
            post:
              security: []
              responses:
                "200":
                  description: Login successful
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-LoginFunctionArn

          # Shared refresh endpoint
          /auth/refresh:
            post:
              security: []
              responses:
                "200":
                  description: Token refreshed
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-RefreshFunctionArn

          # Shared logout endpoint
          /auth/logout:
            post:
              security: []
              responses:
                "200":
                  description: Logout successful
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TargetArn}/invocations"
                    - TargetArn:
                        Fn::ImportValue: !Sub medislot-${Environment}-LogoutFunctionArn

  # Shared registration Lambda permission
  RegisterApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-RegisterFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/POST/auth/register

  LoginApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-LoginFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/POST/auth/login

  RefreshApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-RefreshFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/POST/auth/refresh

  LogoutApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-LogoutFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/POST/auth/logout

  ReferenceSpecialisationsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-ReferenceDataFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/GET/reference/specialisations

  ReferenceHospitalsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub medislot-${Environment}-ReferenceDataFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApplicationApi}/*/GET/reference/hospitals

  AppRouterFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled by default for development.
    Properties:
      FunctionName: !Sub medislot-${Environment}-app-router
      CodeUri: s3://ms-285150348844-dev-art-2341cfb0-d5f7-11f1-8050-0affc22a5315/medislot/api/7b7129e69817b2c0e7ea8d3b5eba0509ba47c4a2/41434610636-1/app-router.zip
      Handler: !Ref AppRouterHandler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-ApplicationLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      ReservedConcurrentExecutions: !If
        - UseReservedConcurrency
        - 1
        - !Ref AWS::NoValue
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ApplicationDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB
      Events:
        ApplicationRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApplicationApi
            Path: /
            Method: ANY
            Auth:
              Authorizer: MediSlotAuthorizer

        ApplicationRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApplicationApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: MediSlotAuthorizer

        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApplicationApi
            Path: /health
            Method: GET

Outputs:
  ApplicationApiId:
    Description: MediSlot single API Gateway ID
    Value: !Ref MediSlotApplicationApi
    Export:
      Name: !Sub medislot-${Environment}-ApplicationApiId

  ApplicationApiBaseUrl:
    Description: MediSlot API base URL
    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}
      - ApiId: !Ref MediSlotApplicationApi
        Stage: !Ref Environment

  AppRouterFunctionName:
    Description: Application router Lambda function name
    Value: !Ref AppRouterFunction

  AppRouterFunctionArn:
    Description: Application router Lambda function ARN
    Value: !GetAtt AppRouterFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-AppRouterFunctionArn

