
name: MediSlot CI/CD

on:
  push:
    branches:
      - feature/network-stack
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: python -m pip install cfn-lint

      - name: Validate Network Stack
        run: |
          test -s cloudformation/network-stack.yaml
          cfn-lint cloudformation/network-stack.yaml

  network-stack:
    name: Network Stack
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name medislot-network-dev \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides Environment=dev

      - name: Show Network Stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name medislot-network-dev \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

  data-stack:
    name: Data Stack
    needs: network-stack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Data Stack
        run: |
          test -s cloudformation/data-stack.yaml
          cfn-lint cloudformation/data-stack.yaml
