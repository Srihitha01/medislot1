AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MediSlot authentication Lambda functions exposed through the shared application API Gateway

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  DBUsername:
    Type: String
    Default: medislot_app
    Description: MySQL application user the Lambda functions connect as

  DBPasswordParameterVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Version of the application database password in SSM SecureString

  JWTSecretParameterVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Version of the JWT signing secret in SSM SecureString

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_NAME: medislot
        DB_USER: !Ref DBUsername
        DB_HOST_PARAMETER: !Sub /medislot/${Environment}/db/host
        DB_PORT_PARAMETER: !Sub /medislot/${Environment}/db/port
        DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/app-password
        DB_MASTER_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
        DB_MASTER_USERNAME: medislotadmin
        DB_PASSWORD_PARAMETER_VERSION: !Ref DBPasswordParameterVersion
        JWT_SECRET_PARAMETER: !Sub /medislot/${Environment}/auth/jwt-secret
        JWT_SECRET_PARAMETER_VERSION: !Ref JWTSecretParameterVersion
        AUTH_TOKENS_TABLE: !Sub medislot-${Environment}-auth-tokens
        ACCESS_TOKEN_MINUTES: "15"
        REFRESH_TOKEN_DAYS: "7"
        PASSWORD_MIN_LENGTH: "10"
        BCRYPT_ROUNDS: "12"

Resources:
  AuthDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub medislot-${Environment}-auth-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SchemaInitializerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub medislot-${Environment}-schema-init-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  RegisterFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled for development to preserve the account unreserved concurrency quota.
    Properties:
      FunctionName: !Sub medislot-${Environment}-register
      CodeUri: ../src/auth/
      Handler: register/register.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-RegisterLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AuthDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

  LoginFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled for development to preserve the account unreserved concurrency quota.
    Properties:
      FunctionName: !Sub medislot-${Environment}-login
      CodeUri: ../src/auth/
      Handler: login/login.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-LoginLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AuthDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

  RefreshFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled for development to preserve the account unreserved concurrency quota.
    Properties:
      FunctionName: !Sub medislot-${Environment}-refresh
      CodeUri: ../src/auth/
      Handler: refresh/refresh.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-RefreshLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AuthDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

  LogoutFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled for development to preserve the account unreserved concurrency quota.
    Properties:
      FunctionName: !Sub medislot-${Environment}-logout
      CodeUri: ../src/auth/
      Handler: logout/logout.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-LogoutLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AuthDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

  AuthorizerFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled for development to preserve the account unreserved concurrency quota.
    Properties:
      FunctionName: !Sub medislot-${Environment}-authorizer
      CodeUri: ../src/auth/
      Handler: authorizer/authorizer.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AuthorizerLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AuthDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

  SchemaInitializerFunction:
    Type: AWS::Serverless::Function #checkov:skip=CKV_AWS_115:Reserved concurrency is disabled because the account unreserved concurrency quota is at its minimum.
    Properties:
      FunctionName: !Sub medislot-${Environment}-schema-init
      Description: Initializes the MySQL schema from the repository schema.sql file
      CodeUri: ../src/auth/
      Handler: schema_init/schema_init.lambda_handler
      Environment:
        Variables:
          DB_APP_USERNAME: !Ref DBUsername
          DB_APP_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/app-password
      # The centralized IAM stack must grant sqs:SendMessage on
      # medislot-${Environment}-schema-init-dlq to RegisterLambdaRole.
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-RegisterLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn
      Timeout: 60
      MemorySize: 256
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt SchemaInitializerDeadLetterQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetA
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetB

Outputs:
  RegisterFunctionName:
    Description: Registration Lambda function name
    Value: !Ref RegisterFunction

  LoginFunctionName:
    Description: Login Lambda function name
    Value: !Ref LoginFunction

  RefreshFunctionName:
    Description: Refresh-token Lambda function name
    Value: !Ref RefreshFunction

  LogoutFunctionName:
    Description: Logout Lambda function name
    Value: !Ref LogoutFunction

  RegisterFunctionArn:
    Description: Registration Lambda function ARN for the shared API Gateway
    Value: !GetAtt RegisterFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-RegisterFunctionArn

  LoginFunctionArn:
    Description: Login Lambda function ARN for the shared API Gateway
    Value: !GetAtt LoginFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-LoginFunctionArn

  RefreshFunctionArn:
    Description: Refresh-token Lambda function ARN
    Value: !GetAtt RefreshFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-RefreshFunctionArn

  LogoutFunctionArn:
    Description: Logout Lambda function ARN
    Value: !GetAtt LogoutFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-LogoutFunctionArn

  AuthorizerFunctionArn:
    Description: Lambda authorizer function ARN for protected APIs
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-AuthorizerFunctionArn