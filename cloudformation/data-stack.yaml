AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MediSlot data layer - private RDS MySQL, DynamoDB tables, S3 photo storage, and SSM configuration

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: RDS storage in GiB

  DBPasswordParameterVersion:
    Type: Number
    MinValue: 1
    Description: Version number of the password in SSM SecureString

Resources:
  # Customer-managed KMS key for DynamoDB table encryption. One key is shared across this environment.
  MediSlotDataKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub MediSlot ${Environment} DynamoDB encryption key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountIAMPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowDynamoDBToUseKeyForTableEncryption
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              Bool:
                kms:GrantIsForAWSResource: true
          - Sid: AllowCloudWatchLogsToUseKeyForLogGroups
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.${AWS::URLSuffix}
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotDataKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/medislot-${Environment}-data
      TargetKeyId: !Ref MediSlotDataKmsKey

  RDSMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-rds-enhanced-monitoring
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # RDS subnet group uses the private subnets exported by network-stack.yaml.
  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for MediSlot MySQL
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetA
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetB
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Password is resolved from SSM SecureString during stack create/update.
  # Development/test cost decision: use single-AZ here; enable Multi-AZ in production.
  MediSlotDB:
    Type: AWS::RDS::DBInstance #checkov:skip=CKV_AWS_157:Single-AZ is an intentional dev/test cost tradeoff; enable Multi-AZ for production.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub medislot-${Environment}-mysql
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: medislot
      MasterUsername: medislotadmin
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/medislot/${Environment}/db/password:${DBPasswordParameterVersion}}}"
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-RDSSecurityGroup
      PubliclyAccessible: false
      EnableIAMDatabaseAuthentication: true
      MultiAZ: false
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RDSMonitoringRole.Arn
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: slot capacity and time lookup.
  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: doctorId
          AttributeType: S
        - AttributeName: startUtc
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi-doctor-time
          KeySchema:
            - AttributeName: doctorId
              KeyType: HASH
            - AttributeName: startUtc
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: request idempotency, with 24-hour expiry managed by the app.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idemKey
          AttributeType: S
      KeySchema:
        - AttributeName: idemKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: waitlist entries and patient lookup.
  # waitlistKey values are expected to use W#joinedAt#patientId or P#patientId.
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-waitlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: waitlistKey
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: waitlistKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi-patient
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: slotId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: temporary hold offers. The application should set activeBucket
  # only for ACTIVE offers and remove it when an offer is no longer active.
  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-hold-offers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offerId
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: expiresAt
          AttributeType: N
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: activeBucket
          AttributeType: S
      KeySchema:
        - AttributeName: offerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi-slot
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
            - AttributeName: expiresAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-patient
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: expiresAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-active
          KeySchema:
            - AttributeName: activeBucket
              KeyType: HASH
            - AttributeName: expiresAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: hashed refresh-token records and JWT denylist entries.
  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-auth-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB: deduplication log for notifications/dispatch events.
  # TTL is enabled; application writes should include numeric expiresAt epoch seconds.
  DispatchLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub medislot-${Environment}-dispatch-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatchKey
          AttributeType: S
      KeySchema:
        - AttributeName: dispatchKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MediSlotDataKmsKey.Arn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Private, encrypted, versioned S3 bucket for doctor profile photos.
  DoctorPhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName:
          Fn::ImportValue: !Sub medislot-${Environment}-AccessLogsBucketName
        LogFilePrefix: doctor-photos/
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorPhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DoctorPhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DoctorPhotosBucket.Arn
              - !Sub ${DoctorPhotosBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # Non-secret database connection values in SSM Parameter Store.
  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/db/host
      Type: String
      Value: !GetAtt MediSlotDB.Endpoint.Address
      Description: MediSlot RDS endpoint
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/db/port
      Type: String
      Value: !GetAtt MediSlotDB.Endpoint.Port
      Description: MediSlot RDS port
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/db/name
      Type: String
      Value: medislot
      Description: MediSlot database name
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

Outputs:
  MediSlotDataKmsKeyArn:
    Description: Customer-managed KMS key used to encrypt MediSlot DynamoDB tables
    Value: !GetAtt MediSlotDataKmsKey.Arn
    Export:
      Name: !Sub medislot-${Environment}-MediSlotDataKmsKeyArn

  DBEndpoint:
    Description: Private RDS MySQL endpoint
    Value: !GetAtt MediSlotDB.Endpoint.Address
    Export:
      Name: !Sub medislot-${Environment}-DBEndpoint

  DBPort:
    Description: RDS MySQL port
    Value: !GetAtt MediSlotDB.Endpoint.Port
    Export:
      Name: !Sub medislot-${Environment}-DBPort

  DBName:
    Description: MediSlot database name
    Value: medislot
    Export:
      Name: !Sub medislot-${Environment}-DBName

  DBPasswordParameterName:
    Description: SSM SecureString parameter name for the RDS master password
    Value: !Sub /medislot/${Environment}/db/password
    Export:
      Name: !Sub medislot-${Environment}-DBPasswordParameterName

  SlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub medislot-${Environment}-SlotsTableName

  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub medislot-${Environment}-IdempotencyTableName

  WaitlistTableName:
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub medislot-${Environment}-WaitlistTableName

  HoldOffersTableName:
    Value: !Ref HoldOffersTable
    Export:
      Name: !Sub medislot-${Environment}-HoldOffersTableName

  AuthTokensTableName:
    Value: !Ref AuthTokensTable
    Export:
      Name: !Sub medislot-${Environment}-AuthTokensTableName

  DispatchLogTableName:
    Value: !Ref DispatchLogTable
    Export:
      Name: !Sub medislot-${Environment}-DispatchLogTableName

  DoctorPhotosBucketName:
    Value: !Ref DoctorPhotosBucket
    Export:
      Name: !Sub medislot-${Environment}-DoctorPhotosBucketName

  DoctorPhotosBucketArn:
    Value: !GetAtt DoctorPhotosBucket.Arn
    Export:
      Name: !Sub medislot-${Environment}-DoctorPhotosBucketArn
