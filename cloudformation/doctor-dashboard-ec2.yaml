AWSTemplateFormatVersion: "2010-09-09"
 
Description: >
  MediSlot Doctor Dashboard EC2 infrastructure.
  Ubuntu 24.04 with Flask, Gunicorn, Nginx and automated S3 release polling.
  Public EC2 access is intentionally enabled for dashboard access from anywhere.
  A fixed Elastic IP keeps the dashboard URL stable across redeployments.
 
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
 
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
 
  ArtifactBucket:
    Type: String
    Description: Existing deployment artifact bucket.
 
  ArtifactKey:
    Type: String
    Description: S3 object key for doctor-dashboard-app.zip.
 
  ApiBaseUrl:
    Type: String
    Description: API Gateway invoke URL including stage.
 
  LoginPath:
    Type: String
    Default: /auth/login
    AllowedPattern: '^/.*'
 
  DashboardAccessCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      Public IPv4 CIDR allowed to access the dashboard.
      0.0.0.0/0 allows access from anywhere.
 
Resources:
 
  DoctorDashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_260
            comment: >
              Intentional public HTTP access is required so doctors can
              access the MediSlot dashboard from anywhere.
    Properties:
      GroupDescription: Allow public HTTP access to MediSlot Doctor Dashboard.
      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId
 
      SecurityGroupIngress:
        - Description: Public dashboard HTTP access.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref DashboardAccessCidr
 
      SecurityGroupEgress:
        - Description: Allow outbound traffic.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
 
      Tags:
        - Key: Name
          Value: !Sub medislot-doctor-dashboard-${Environment}-sg
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
 
  DoctorDashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-doctor-dashboard-${Environment}-role
 
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
 
      Policies:
        - PolicyName: DownloadDoctorDashboardArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/medislot/doctor-dashboard/*
 
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
 
  DoctorDashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-doctor-dashboard-${Environment}-profile
      Roles:
        - !Ref DoctorDashboardRole
 
  # Fixed public IP so the dashboard URL does not change when the instance
  # is replaced on each deployment (ArtifactKey changes on every run).
  DoctorDashboardEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub medislot-doctor-dashboard-${Environment}-eip
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
 
  DoctorDashboardEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DoctorDashboardEip.AllocationId
      InstanceId: !Ref DoctorDashboardInstanceV2
 
  DoctorDashboardInstanceV2:
    Type: AWS::EC2::Instance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_88
            comment: >
              Intentional public IPv4 address. The MediSlot Doctor Dashboard
              must be directly accessible from anywhere without an ALB.
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
 
      InstanceType: !Ref InstanceType
 
      IamInstanceProfile: !Ref DoctorDashboardInstanceProfile
 
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
 
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-PublicSubnetA
 
          GroupSet:
            - !Ref DoctorDashboardSecurityGroup
 
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
 
      Monitoring: true
 
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
 
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
 
          exec > >(tee /var/log/medislot-dashboard-setup.log | logger -t user-data -s 2>/dev/console) 2>&1
 
          export DEBIAN_FRONTEND=noninteractive
          export AWS_DEFAULT_REGION="${AWS::Region}"
 
          APT="apt-get -o DPkg::Lock::Timeout=300 -y"
          $APT update
          $APT install python3 python3-venv python3-pip nginx curl unzip openssl

          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q -o /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install --update
          fi

          install -d -o ubuntu -g ubuntu /opt/medislot-dashboard
          /usr/local/bin/aws s3 cp "s3://${ArtifactBucket}/${ArtifactKey}" /tmp/doctor-dashboard-app.zip
          unzip -o /tmp/doctor-dashboard-app.zip -d /opt/medislot-dashboard
          chown -R ubuntu:ubuntu /opt/medislot-dashboard

          sudo -u ubuntu python3 -m venv /opt/medislot-dashboard/venv
          sudo -u ubuntu /opt/medislot-dashboard/venv/bin/pip install --upgrade pip
          sudo -u ubuntu /opt/medislot-dashboard/venv/bin/pip install -r /opt/medislot-dashboard/requirements.txt

          # Stable secret shared by all gunicorn workers (no file-creation race).
          umask 077
          echo "FLASK_SECRET_KEY=$(openssl rand -hex 32)" > /etc/medislot-dashboard.env
          umask 022

          cat > /etc/systemd/system/medislot-dashboard.service <<'SERVICE'
          [Unit]
          Description=MediSlot Doctor Dashboard Flask Application
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/medislot-dashboard
          EnvironmentFile=/etc/medislot-dashboard.env
          Environment="MEDISLOT_API_BASE_URL=${ApiBaseUrl}"
          Environment="MEDISLOT_LOGIN_PATH=${LoginPath}"
          Environment="COOKIE_SECURE=false"
          ExecStart=/opt/medislot-dashboard/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --access-logfile - --error-logfile - app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          cat > /etc/nginx/sites-available/medislot-dashboard <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 2m;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX

          rm -f /etc/nginx/sites-enabled/default
          ln -sfn /etc/nginx/sites-available/medislot-dashboard /etc/nginx/sites-enabled/medislot-dashboard
          nginx -t

          systemctl daemon-reload
          systemctl enable medislot-dashboard nginx
          systemctl restart medislot-dashboard
          systemctl restart nginx

          # Self-managed in-place releases; no SSH or SSM Run Command required.
          cat > /usr/local/sbin/medislot-dashboard-pull <<'PULLSCRIPT'
          #!/bin/bash
          set -euo pipefail
          export AWS_DEFAULT_REGION="__REGION__"
          BUCKET="__BUCKET__"
          PREFIX="medislot/doctor-dashboard"
          MANIFEST="s3://$BUCKET/$PREFIX/latest-__ENV__.txt"
          APP_DIR="/opt/medislot-dashboard"
          exec 9>/run/medislot-dashboard-pull.lock
          flock -n 9 || exit 0
          KEY=$(aws s3 cp "$MANIFEST" - --region "$AWS_DEFAULT_REGION" 2>/dev/null | tr -d '\\r\\n') || exit 0
          [[ "$KEY" == "$PREFIX/"*"/doctor-dashboard-app.zip" ]] || exit 1
          [[ "$KEY" != *".."* && "$KEY" != *" "* ]] || exit 1
          [[ -n "$KEY" ]] || exit 0
          CURRENT=$(cat /var/lib/medislot-dashboard/deployed-key 2>/dev/null || true)
          [[ "$CURRENT" != "$KEY" ]] || exit 0
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          aws s3 cp "s3://$BUCKET/$KEY" "$WORK/release.zip" --region "$AWS_DEFAULT_REGION" --only-show-errors
          unzip -tq "$WORK/release.zip"
          mkdir -p "$WORK/new" "$WORK/old"
          unzip -oq "$WORK/release.zip" -d "$WORK/new"
          test -s "$WORK/new/app.py"
          test -s "$WORK/new/requirements.txt"
          # Preserve venv and runtime files; restore application files on failure.
          cp -a "$APP_DIR/." "$WORK/old/"
          cp -a "$WORK/new/." "$APP_DIR/"
          chown -R ubuntu:ubuntu "$APP_DIR"
          if ! sudo -u ubuntu "$APP_DIR/venv/bin/pip" install --disable-pip-version-check -r "$APP_DIR/requirements.txt" || ! systemctl restart medislot-dashboard || ! curl -fsS --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/health; then
            cp -a "$WORK/old/." "$APP_DIR/"
            chown -R ubuntu:ubuntu "$APP_DIR"
            systemctl restart medislot-dashboard || true
            exit 1
          fi
          install -d /var/lib/medislot-dashboard
          printf '%s\\n' "$KEY" > /var/lib/medislot-dashboard/deployed-key
          PULLSCRIPT
          sed -i "s|__REGION__|${AWS::Region}|g; s|__BUCKET__|${ArtifactBucket}|g; s|__ENV__|${Environment}|g" /usr/local/sbin/medislot-dashboard-pull
          chmod 700 /usr/local/sbin/medislot-dashboard-pull

          cat > /etc/systemd/system/medislot-dashboard-pull.service <<'PULLSERVICE'
          [Unit]
          Description=Pull MediSlot dashboard releases from S3
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/medislot-dashboard-pull
          PULLSERVICE

          cat > /etc/systemd/system/medislot-dashboard-pull.timer <<'PULLTIMER'
          [Unit]
          Description=Check MediSlot dashboard releases every minute

          [Timer]
          OnBootSec=90s
          OnUnitInactiveSec=60s
          Unit=medislot-dashboard-pull.service

          [Install]
          WantedBy=timers.target
          PULLTIMER

          systemctl daemon-reload
          systemctl enable --now medislot-dashboard-pull.timer

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "Dashboard is up."; exit 0; fi
            sleep 2
          done
          journalctl -u medislot-dashboard --no-pager -n 50
          exit 1

      Tags:
        - Key: Name
          Value: !Sub medislot-doctor-dashboard-${Environment}
        - Key: Project
          Value: MediSlot
        - Key: Component
          Value: DoctorDashboard
        - Key: Environment
          Value: !Ref Environment
 
Outputs:
 
  InstanceId:
    Description: Doctor Dashboard EC2 instance ID.
    Value: !Ref DoctorDashboardInstanceV2
 
  PublicIp:
    Description: Doctor Dashboard fixed Elastic IP address.
    Value: !Ref DoctorDashboardEip
 
  DashboardUrl:
    Description: Doctor Dashboard URL (HTTP only, port 80).
    Value: !Sub http://${DoctorDashboardEip}
 
  HealthCheckUrl:
    Description: Doctor Dashboard health endpoint.
    Value: !Sub http://${DoctorDashboardEip}/health
 
  SecurityGroupId:
    Description: Doctor Dashboard security group ID.
    Value: !Ref DoctorDashboardSecurityGroup
 
  InstanceRoleArn:
    Description: Doctor Dashboard EC2 IAM role ARN.
    Value: !GetAtt DoctorDashboardRole.Arn