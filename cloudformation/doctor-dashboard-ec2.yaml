AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot Doctor Dashboard EC2 infrastructure.
  Ubuntu 24.04 with Flask, Gunicorn, Nginx and AWS Systems Manager access.
  Public HTTP access is intentionally enabled for the development dashboard.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: MediSlot deployment environment.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: EC2 instance type for the Doctor Dashboard.

  DashboardAccessCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      IPv4 CIDR allowed to access the dashboard over HTTP.
      0.0.0.0/0 intentionally allows all doctors to reach the dashboard.
      Use HTTPS and authenticated application sessions before production use.

Resources:
  #checkov:skip=CKV_AWS_260: Public HTTP on port 80 is an explicit requirement for this dashboard deployment. Application authentication must be enforced by the dashboard; HTTPS should be added before production.
  DoctorDashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP access to the MediSlot Doctor Dashboard.
      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId
      SecurityGroupIngress:
        - Description: Public HTTP access for doctors to reach the dashboard through Nginx.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref DashboardAccessCidr
      SecurityGroupEgress:
        - Description: Allow outbound traffic for operating system updates, Python packages and AWS service access.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub medislot-doctor-dashboard-${Environment}-sg
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorDashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-doctor-dashboard-${Environment}-role
      Description: EC2 role for MediSlot Doctor Dashboard with SSM access.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorDashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-doctor-dashboard-${Environment}-profile
      Roles:
        - !Ref DoctorDashboardRole

  #checkov:skip=CKV_AWS_88: A public IPv4 address is intentionally required because all doctors must reach this EC2-hosted dashboard directly over the internet. The instance is placed in the existing public subnet and exposes only HTTP port 80 through its security group; Gunicorn is bound to loopback.
  DoctorDashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DoctorDashboardInstanceProfile

      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-PublicSubnetA
          GroupSet:
            - !Ref DoctorDashboardSecurityGroup

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required

      Monitoring: true

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true

      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux

          exec > >(tee /var/log/medislot-dashboard-setup.log | logger -t user-data -s 2>/dev/console) 2>&1

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y
          apt-get install -y python3 python3-venv python3-pip nginx curl

          install -d -o ubuntu -g ubuntu /opt/medislot-dashboard
          cd /opt/medislot-dashboard

          python3 -m venv /opt/medislot-dashboard/venv
          /opt/medislot-dashboard/venv/bin/pip install --upgrade pip
          /opt/medislot-dashboard/venv/bin/pip install flask gunicorn requests

          cat > /opt/medislot-dashboard/app.py <<'PYTHON'
          from flask import Flask, jsonify, render_template_string

          app = Flask(__name__)

          @app.route("/")
          def home():
              return render_template_string("""
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>MediSlot Doctor Dashboard</title>
                  <style>
                      * { box-sizing: border-box; }
                      body {
                          margin: 0;
                          font-family: Arial, sans-serif;
                          background: #f4f7fb;
                          color: #243247;
                      }
                      header {
                          background: #123b62;
                          color: white;
                          padding: 24px 40px;
                      }
                      main { padding: 40px; }
                      .card {
                          background: white;
                          padding: 28px;
                          border-radius: 12px;
                          max-width: 680px;
                          box-shadow: 0 3px 14px rgba(0,0,0,.07);
                      }
                      .status {
                          color: #16834a;
                          font-weight: bold;
                      }
                  </style>
              </head>
              <body>
                  <header>
                      <h1>MediSlot</h1>
                      <p>Doctor Dashboard</p>
                  </header>
                  <main>
                      <section class="card">
                          <h2>Welcome to MediSlot</h2>
                          <p>Your Doctor Dashboard server is running.</p>
                          <p class="status">Application status: Online</p>
                          <p>Flask + Gunicorn + Nginx</p>
                      </section>
                  </main>
              </body>
              </html>
              """)

          @app.route("/health")
          def health():
              return jsonify(status="healthy"), 200
          PYTHON

          chown -R ubuntu:ubuntu /opt/medislot-dashboard

          cat > /etc/systemd/system/medislot-dashboard.service <<'SERVICE'
          [Unit]
          Description=MediSlot Doctor Dashboard Flask Application
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/medislot-dashboard
          ExecStart=/opt/medislot-dashboard/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --access-logfile - --error-logfile - app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          cat > /etc/nginx/sites-available/medislot-dashboard <<'NGINX'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX

          rm -f /etc/nginx/sites-enabled/default
          ln -s /etc/nginx/sites-available/medislot-dashboard /etc/nginx/sites-enabled/medislot-dashboard

          systemctl daemon-reload
          systemctl enable medislot-dashboard
          systemctl restart medislot-dashboard

          nginx -t
          systemctl enable nginx
          systemctl restart nginx

      Tags:
        - Key: Name
          Value: !Sub medislot-doctor-dashboard-${Environment}
        - Key: Project
          Value: MediSlot
        - Key: Component
          Value: DoctorDashboard
        - Key: Environment
          Value: !Ref Environment

Outputs:
  InstanceId:
    Description: Doctor Dashboard EC2 instance ID.
    Value: !Ref DoctorDashboardInstance

  PublicIp:
    Description: Doctor Dashboard public IPv4 address.
    Value: !GetAtt DoctorDashboardInstance.PublicIp

  PublicDns:
    Description: Doctor Dashboard public DNS name.
    Value: !GetAtt DoctorDashboardInstance.PublicDnsName

  DashboardUrl:
    Description: Doctor Dashboard URL.
    Value: !Sub
      - http://${DashboardHost}
      - DashboardHost: !GetAtt DoctorDashboardInstance.PublicDnsName

  HealthCheckUrl:
    Description: Doctor Dashboard health endpoint.
    Value: !Sub
      - http://${DashboardHost}/health
      - DashboardHost: !GetAtt DoctorDashboardInstance.PublicDnsName

  SecurityGroupId:
    Description: Doctor Dashboard security group ID.
    Value: !Ref DoctorDashboardSecurityGroup

  InstanceRoleArn:
    Description: Doctor Dashboard EC2 IAM role ARN.
    Value: !GetAtt DoctorDashboardRole.Arn