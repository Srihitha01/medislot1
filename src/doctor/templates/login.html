<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Doctor Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
            color: #18324b;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 18px 55px rgba(25, 59, 91, 0.12);
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #145b91;
        }

        .brand span {
            color: #20a6a0;
        }

        h1 {
            font-size: 24px;
            margin-top: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c7b8c;
            margin-bottom: 26px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e0e9;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #b6d9f5;
            border-color: #2786bd;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 9px;
            background: #145b91;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0e4775;
        }

        .message {
            padding: 11px;
            border-radius: 8px;
            margin: 12px 0;
            background: #fff0f0;
            color: #a32b2b;
            font-size: 13px;
        }

        .message.success {
            background: #edfaf3;
            color: #176a42;
        }

        small {
            display: block;
            text-align: center;
            color: #8794a1;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="brand">
            Medi<span>Slot</span>
        </div>

        <h1>Doctor Login</h1>

        <p class="subtitle">
            Sign in to manage your appointments and availability.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Sign in to Dashboard
            </button>

        </form>

        <small>Secure MediSlot Doctor Workspace</small>

    </main>

</body>
</html>
